name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
      - name: API-Diagnose (bei Fehler)
        if: failure() || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[diag]')
        run: |
          JAR=$(find ~/.gradle .gradle -name 'minecraft-*.jar' -path '*26.3*' 2>/dev/null | grep -v sources | head -1)
          echo "JAR=$JAR"
          CP=$(find ~/.gradle -name '*.jar' | tr '\n' ':')
          { javap -p -cp "$JAR:$CP" net.minecraft.client.renderer.entity.state.AvatarRenderState net.minecraft.client.renderer.entity.state.LivingEntityRenderState net.minecraft.client.renderer.entity.state.EntityRenderState net.minecraft.client.gui.screens.Screen net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper net.minecraft.client.input.KeyEvent
            javap -p -cp "$JAR:$CP" com.mojang.blaze3d.platform.InputConstants | grep -v "static final int"
            javap -p -cp "$JAR:$CP" net.minecraft.client.KeyMapping | grep -iv lambda
            javap -p -cp "$JAR:$CP" com.mojang.blaze3d.platform.Window | grep -i "focus\|framerate\|minimi\|handle"
            javap -p -cp "$JAR:$CP" net.minecraft.client.Minecraft | grep -i "active\|focus\|framerate\|fps"
            javap -p -cp "$JAR:$CP" net.minecraft.client.Options | grep -i "framerate\|inactiv\|camera\|fps"
            javap -p -cp "$JAR:$CP" net.minecraft.client.renderer.entity.player.AvatarRenderer | grep -iv lambda
          } > api.txt 2>&1 || true
          # Log in Branch ci-logs ablegen, damit er per API lesbar ist
          mkdir /tmp/logs && cp build.log api.txt /tmp/logs/ 2>/dev/null || true
          cd /tmp/logs && git init -q && git checkout -q -b ci-logs && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "log ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
      - uses: actions/upload-artifact@v4
        with:
          name: LellekHUD-jar
          path: build/libs/*.jar
      - name: Version lesen
        id: ver
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Release (Download)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: LellekHUD ${{ steps.ver.outputs.version }} für Minecraft 26.3
          body: |
            **Download:** `LellekHUD-26.3-${{ steps.ver.outputs.version }}.jar` unten unter *Assets* – in den `mods`-Ordner legen.
            Benötigt: Minecraft 26.3, Fabric Loader ≥ 0.19.5, Fabric API, Java 25.

            Neu: Smooth Zoom (C halten, Mausrad zoomt bis 50x näher ran), HUD-Elemente bleiben beim Ändern von Fenster-/GUI-/Element-Größe an ihrem Platz, Editor mit Einrasten und Mausrad-Größe.
          files: build/libs/LellekHUD-26.3-${{ steps.ver.outputs.version }}.jar
          make_latest: true
